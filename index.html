<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Quản lý chi tiêu</title><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script src="firebase-config.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--bd:#e5e7eb;--pr:#0f766e;--in:#15803d;--ex:#c2410c;--tf:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--pr:#2dd4bf;--in:#4ade80;--ex:#fb923c;--tf:#60a5fa;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mu:#9aa3af;--bd:#2c333c;--pr:#2dd4bf;--in:#4ade80;--ex:#fb923c;--tf:#60a5fa;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px;overscroll-behavior:none;-webkit-overflow-scrolling:touch}
main{max-width:560px;margin:auto;padding:12px;contain:layout style}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px;contain:layout style}
h2{font-size:13px;color:var(--mu);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:13px}.r{text-align:right}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--bd);content-visibility:auto;contain-intrinsic-size:auto 44px}.row:first-of-type{border-top:0}
.in{color:var(--in)}.ex{color:var(--ex)}.tf{color:var(--tf)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;transform:translateZ(0)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0;font-size:12px;touch-action:manipulation}nav button.on{color:var(--pr);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--pr);color:#fff;font-size:30px;z-index:6;box-shadow:0 4px 12px #0004;touch-action:manipulation;transform:translateZ(0)}
button.s{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 10px;font-size:13px;touch-action:manipulation}
button.p{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:12px;width:100%;font-size:16px;margin-top:8px;touch-action:manipulation}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:4px 0 8px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;touch-action:manipulation}.seg button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
#md{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#md.show{display:flex}
#md>div{background:var(--card);width:100%;max-width:560px;margin:auto auto 0;border-radius:18px 18px 0 0;padding:16px;max-height:92%;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateZ(0)}
.bar{height:8px;border-radius:4px;background:var(--pr);margin:3px 0}.sub{font-size:13px;color:var(--mu);display:flex;justify-content:space-between;padding-left:12px}
svg{width:100%;height:auto;display:block}
#lk{position:fixed;inset:0;background:var(--bg);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px}.lkb{width:100%;max-width:340px;text-align:center}
.dayh{font-size:13px;font-weight:700;color:var(--pr);padding:10px 0 4px;margin-top:6px;border-bottom:1px solid var(--bd)}
.searchbox{position:relative;margin-bottom:8px}
.searchbox input{margin:0;padding-right:36px}
.slist{max-height:180px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
.slist div{padding:10px 12px;border-bottom:1px solid var(--bd);cursor:pointer;touch-action:manipulation}
.slist div:last-child{border-bottom:0}
.slist div:active,.slist div.on{background:var(--pr);color:#fff}
.slist .muted{color:var(--mu);font-size:12px}
.acc-link{cursor:pointer;text-decoration:underline;text-underline-offset:2px;touch-action:manipulation}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:13px;margin:2px}
</style></head><body>
<main id="app"></main><div id="lk"></div>
<button class="fab" onclick="openTx()">+</button>
<nav id="nav"></nav><div id="md" onclick="if(event.target===this)closeM()"><div id="mb"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Math.round(n).toLocaleString('vi-VN'),uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function seed(){const a=(n,g)=>({id:uid(),name:n,gid:g,open:0,hidden:false});
return{groups:[
  {id:'g1',name:'Tiền mặt'},
  {id:'g2',name:'Ngân hàng'},
  {id:'g3',name:'Tiết kiệm'},
  {id:'g4',name:'Tài sản'},
  {id:'g5',name:'Ví điện tử'},
  {id:'g6',name:'Vay nợ'}
],
accounts:[
  a('Tiền mặt','g1'),
  a('VCB','g2'),a('TCB','g2'),a('MBB','g2'),
  a('tk Tiền mặt','g3'),a('tk VCB','g3'),a('tk TCB','g3'),a('tk MBB','g3'),
  a('Vàng','g4'),a('Nhà - Đất','g4'),
  a('Vay nợ','g6')
],
cats:{
  inc:['Tiền lương','Tiền thưởng','Tiền lãi','Thu khác','Vay nợ'],
  exp:{
    'Ăn uống':['Sáng - Trưa - Tối','Cafe - Ăn ngoài'],
    'Sinh hoạt':['Thuê nhà','Điện','Nước','Cá nhân','Internet - Điện thoại','Sửa chữa nhà cửa'],
    'Đi lại':['Phí cầu đường - Đò phà','Xăng xe','Taxi'],
    'Sự kiện':['Hiếu - Hỉ','Trả nợ','Sự kiện khác'],
    'Khác':['Khác']
  }
},tx:[],budget:{},rec:[]}}
let S;
const save=()=>{markDirty();persist()};
function runRec(){let ch=0;const td=today();(S.rec||[]).forEach(r=>{let g=0;while(g++<600){const[y,m]=r.next.split('-').map(Number),dn=new Date(y,m,0).getDate(),d=`${r.next}-${String(Math.min(r.day,dn)).padStart(2,'0')}`;if(d>td)break;const t={id:uid(),d,type:r.type,amt:r.amt,acc:r.acc,note:r.note||'',rid:r.id};if(r.type=='tf')t.to=r.to;else{t.cat=r.cat;t.sub=r.sub}S.tx.push(t);ch=1;r.next=m==12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`}});if(ch)save()}
function spent(pre){const o={};S.tx.forEach(t=>{if(t.type=='exp'&&t.d.startsWith(pre))o[t.cat]=(o[t.cat]||0)+t.amt});return o}
function warns(){const sp=spent(today().slice(0,7));return Object.keys(S.budget||{}).filter(k=>S.budget[k]>0&&(sp[k]||0)>=S.budget[k]*.8).map(k=>({k,s:sp[k],b:S.budget[k]}))}
const wb=()=>{const w=warns();return w.length?`<div class="card" style="border-color:var(--ex)"><h2>⚠ Cảnh báo ngân sách tháng này</h2>`+w.map(x=>`<div class="row"><span>${esc(x.k)}</span><b class="${x.s>=x.b?'ex':''}">${fmt(x.s)} / ${fmt(x.b)} (${Math.round(x.s/x.b*100)}%)</b></div>`).join('')+'</div>':''};
function setB(i){const k=Object.keys(S.cats.exp)[i],v=prompt('Ngân sách tháng cho "'+k+'" (₫). Để trống/0 = bỏ:',S.budget[k]||'');if(v===null)return;const n=parseFloat(String(v).replace(/[.,\s]/g,''));if(n>0)S.budget[k]=n;else delete S.budget[k];save();render()}
function delR(id){if(confirm('Xóa giao dịch định kỳ? (các giao dịch đã tạo vẫn giữ)')){S.rec=S.rec.filter(r=>r.id!=id);save();render()}}
let tab='home',cp='m',cy=new Date().getFullYear(),cm=new Date().getMonth()+1,tType='exp';
const acc=id=>S.accounts.find(a=>a.id==id),an=id=>acc(id)?acc(id).name:'(đã xóa)';
let _balCache=null,_balDirty=1;
function markDirty(){_balDirty=1}
function balMap(){
  if(!_balDirty&&_balCache)return _balCache;
  const m={};S.accounts.forEach(a=>{m[a.id]=a.open||0});
  S.tx.forEach(t=>{
    if(t.type=='inc')m[t.acc]=(m[t.acc]||0)+t.amt;
    else if(t.type=='exp')m[t.acc]=(m[t.acc]||0)-t.amt;
    else if(t.type=='tf'){m[t.acc]=(m[t.acc]||0)-t.amt;m[t.to]=(m[t.to]||0)+t.amt}
    else if(t.type=='adj')m[t.acc]=(m[t.acc]||0)+t.amt;
  });
  _balCache=m;_balDirty=0;return m;
}
function bal(a){return balMap()[a.id]||0}
let _navReady=0;
function render(){
  if(!_navReady){
    const T=[['home','Ví'],['hist','Lịch sử'],['chart','Biểu đồ'],['set','Cài đặt']];
    $('#nav').innerHTML=T.map(([k,l])=>`<button data-tab="${k}" class="${tab==k?'on':''}">${l}</button>`).join('');
    $('#nav').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;render()};
    _navReady=1;
  }else{
    $('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  }
  requestAnimationFrame(()=>{
    $('#app').innerHTML={home,hist,chart,set}[tab]();
    window.scrollTo(0,0);
  });
}
function home(){let tot=0,h='';S.groups.forEach(g=>{const as=S.accounts.filter(a=>a.gid==g.id&&!a.hidden);if(!as.length)return;const s=as.reduce((x,a)=>x+bal(a),0);tot+=s;
h+=`<div class="card"><h2><span>${esc(g.name)}</span><span>${fmt(s)}</span></h2>`+as.map(a=>`<div class="row"><span class="acc-link" onclick="viewAcc('${a.id}')">${esc(a.name)}</span><span><b>${fmt(bal(a))}</b> <button class="s" onclick="adj('${a.id}')">Chỉnh</button></span></div>`).join('')+'</div>'});
return wb()+`<div class="card"><div class="mu">Tổng tài sản ròng (₫)</div><div class="big">${fmt(tot)}</div></div>`+h+'<div class="mu">Bấm tên ví để xem chi tiết giao dịch. "Chỉnh" dùng để cập nhật số dư/giá trị thực (vd giá vàng, đất tăng giảm).</div>'}

/* ===== LỊCH SỬ: nhóm theo ngày, trong ngày theo thứ tự nhập ===== */
function hist(){
  const list=[...S.tx].sort((a,b)=>{
    const dc=b.d.localeCompare(a.d);
    if(dc!==0)return dc;
    // cùng ngày: thứ tự nhập (id tăng dần ≈ nhập trước trước)
    return (a.id||'').localeCompare(b.id||'');
  });
  if(!list.length)return'<div class="card mu">Chưa có giao dịch. Bấm + để thêm.</div>';
  let html='',lastD='';
  list.slice(0,300).forEach(t=>{
    if(t.d!==lastD){
      lastD=t.d;
      const [y,m,d]=t.d.split('-');
      const days=['CN','T2','T3','T4','T5','T6','T7'];
      const wd=days[new Date(+y,+m-1,+d).getDay()];
      html+=`<div class="dayh">${wd}, ${d}/${m}/${y}</div>`;
    }
    const c={inc:'in',exp:'ex',tf:'tf',adj:'mu'}[t.type];
    const sg={inc:'+',exp:'−',tf:'⇄',adj:t.amt<0?'−':'+'}[t.type];
    const w=t.type=='tf'?`${esc(an(t.acc))} → ${esc(an(t.to))}`:esc(an(t.acc));
    const title=t.type=='adj'?'Điều chỉnh số dư':esc(t.cat||'Chuyển tiền')+(t.sub&&t.sub!=t.cat?' › '+esc(t.sub):'');
    html+=`<div class="row"><div><div>${title}</div><div class="mu">${w}${t.note?' · '+esc(t.note):''}</div></div><div class="r ${c}"><b>${sg}${fmt(Math.abs(t.amt))}</b><br>${t.type!='adj'?`<button class="s" onclick="openTx('${t.id}')">Sửa</button> `:''}<button class="s" onclick="del('${t.id}')">Xóa</button></div></div>`;
  });
  return`<div class="card">${html}</div>`;
}

function bars(items){const mx=Math.max(1,...items.map(i=>Math.max(i.a,i.b))),n=items.length,w=340/n,H=100;
return`<svg viewBox="0 0 360 130">`+items.map((it,i)=>{const x=10+i*w,bw=Math.max(2,w*.38),ha=it.a/mx*H,hb=it.b/mx*H;
return`<rect x="${x}" y="${H-ha+5}" width="${bw}" height="${ha}" fill="var(--in)" rx="1"/><rect x="${x+bw+1}" y="${H-hb+5}" width="${bw}" height="${hb}" fill="var(--ex)" rx="1"/>`+(n<=12||it.l%5==0?`<text x="${x+bw}" y="122" font-size="9" text-anchor="middle" fill="var(--mu)">${it.l}</text>`:'')}).join('')+'</svg>'}
function chart(){const pre=cp=='m'?`${cy}-${String(cm).padStart(2,'0')}`:`${cy}`;const L=S.tx.filter(t=>t.d.startsWith(pre)&&(t.type=='inc'||t.type=='exp'));
const inc=L.filter(t=>t.type=='inc').reduce((s,t)=>s+t.amt,0),ex=L.filter(t=>t.type=='exp').reduce((s,t)=>s+t.amt,0);
let items=[];if(cp=='y')for(let m=1;m<=12;m++){const p=`${cy}-${String(m).padStart(2,'0')}`,q=S.tx.filter(t=>t.d.startsWith(p));items.push({l:m,a:q.filter(t=>t.type=='inc').reduce((s,t)=>s+t.amt,0),b:q.filter(t=>t.type=='exp').reduce((s,t)=>s+t.amt,0)})}
else{const dn=new Date(cy,cm,0).getDate();for(let d=1;d<=dn;d++){const p=`${pre}-${String(d).padStart(2,'0')}`,q=L.filter(t=>t.d==p);items.push({l:d,a:q.filter(t=>t.type=='inc').reduce((s,t)=>s+t.amt,0),b:q.filter(t=>t.type=='exp').reduce((s,t)=>s+t.amt,0)})}}
const by={};L.filter(t=>t.type=='exp').forEach(t=>{const g=by[t.cat]=by[t.cat]||{s:0,sub:{}};g.s+=t.amt;g.sub[t.sub]=(g.sub[t.sub]||0)+t.amt});
const ks=Object.keys(by).sort((a,b)=>by[b].s-by[a].s),mx=ks.length?by[ks[0]].s:1;
const ib=(k,v)=>`<div class="row" style="border:0"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`;
return`<div class="seg"><button class="${cp=='m'?'on':''}" onclick="cp='m';render()">Tháng</button><button class="${cp=='y'?'on':''}" onclick="cp='y';render()">Năm</button></div>
<div class="card" style="margin-top:12px"><div class="row" style="border:0"><button class="s" onclick="nav(-1)">‹</button><b>${cp=='m'?'Tháng '+cm+'/':'Năm '}${cy}</b><button class="s" onclick="nav(1)">›</button></div>
<div class="row"><span>Thu</span><b class="in">${fmt(inc)}</b></div><div class="row"><span>Chi</span><b class="ex">${fmt(ex)}</b></div><div class="row"><span>Còn lại</span><b>${fmt(inc-ex)}</b></div></div>
<div class="card"><h2>${cp=='m'?'Theo ngày':'Theo tháng'} <span><span class="in">■ Thu</span> <span class="ex">■ Chi</span></span></h2>${bars(items)}</div>
<div class="card"><h2>Chi theo hạng mục</h2>${ks.length?ks.map(k=>`${ib(k+' ('+Math.round(by[k].s/ex*100)+'%)',by[k].s)}<div class="bar" style="width:${by[k].s/mx*100}%${cp=='m'&&S.budget[k]&&by[k].s>=S.budget[k]?';background:var(--ex)':''}"></div>${cp=='m'&&S.budget[k]?`<div class="mu">Ngân sách ${fmt(S.budget[k])} · ${by[k].s>S.budget[k]?'<b class="ex">vượt '+fmt(by[k].s-S.budget[k])+'</b>':'còn '+fmt(S.budget[k]-by[k].s)}</div>`:''}`+Object.keys(by[k].sub).map(s=>`<div class="sub"><span>${esc(s)}</span><span>${fmt(by[k].sub[s])}</span></div>`).join('')).join(''):'<div class="mu">Chưa có khoản chi.</div>'}</div>`}
function nav(d){if(cp=='y')cy+=d;else{cm+=d;if(cm>12){cm=1;cy++}if(cm<1){cm=12;cy--}}render()}

/* ===== CÀI ĐẶT: quản lý hạng mục đầy đủ ===== */
function set(){const used=id=>S.tx.some(t=>t.acc==id||t.to==id);
return S.groups.map(g=>`<div class="card"><h2><span>${esc(g.name)}</span><span><button class="s" onclick="addAcc('${g.id}')">+ Ví</button> <button class="s" onclick="renG('${g.id}')">Sửa</button> <button class="s" onclick="delG('${g.id}')">Xóa</button></span></h2>`+S.accounts.filter(a=>a.gid==g.id).map(a=>`<div class="row"><span style="${a.hidden?'opacity:.5':''}">${esc(a.name)}${a.hidden?' (ẩn)':''}</span><span><button class="s" onclick="renA('${a.id}')">Sửa</button> <button class="s" onclick="rmA('${a.id}')">${used(a.id)?(a.hidden?'Hiện':'Ẩn'):'Xóa'}</button></span></div>`).join('')+'</div>').join('')+
`<button class="s" onclick="addG()" style="width:100%;margin-bottom:12px">+ Thêm nhóm ví</button>
<div class="card"><h2><span>Hạng mục thu</span><button class="s" onclick="addCat('inc')">+ Thêm</button></h2>
${S.cats.inc.map((c,i)=>`<div class="row"><span>${esc(c)}</span><span><button class="s" onclick="renCat('inc',${i})">Sửa</button> <button class="s" onclick="delCat('inc',${i})">Xóa</button></span></div>`).join('')||'<div class="mu">Chưa có</div>'}
</div>
<div class="card"><h2><span>Hạng mục chi</span><button class="s" onclick="addCat('exp')">+ Thêm nhóm</button></h2>
${Object.keys(S.cats.exp).map(g=>`<div style="margin-bottom:10px"><div class="row" style="border:0"><b>${esc(g)}</b><span><button class="s" onclick="renExpG('${esc(g)}')">Sửa</button> <button class="s" onclick="delExpG('${esc(g)}')">Xóa</button> <button class="s" onclick="addSub('${esc(g)}')">+ Mục con</button></span></div>
${(S.cats.exp[g]||[]).map((s,si)=>`<div class="row"><span style="padding-left:12px">${esc(s)}</span><span><button class="s" onclick="renSub('${esc(g)}',${si})">Sửa</button> <button class="s" onclick="delSub('${esc(g)}',${si})">Xóa</button></span></div>`).join('')}
</div>`).join('')||'<div class="mu">Chưa có</div>'}
</div>
<div class="card"><h2>Ngân sách tháng (theo nhóm chi)</h2>${Object.keys(S.cats.exp).map((k,i)=>`<div class="row"><span>${esc(k)}</span><span><b>${S.budget[k]?fmt(S.budget[k]):'—'}</b> <button class="s" onclick="setB(${i})">Đặt</button></span></div>`).join('')}<div class="mu">Cảnh báo từ 80%, đỏ khi vượt.</div></div>
<div class="card"><h2><span>Giao dịch định kỳ</span><button class="s" onclick="openTx(null,1)">+ Thêm</button></h2>${(S.rec||[]).length?S.rec.map(r=>`<div class="row"><div><div>${r.type=='inc'?'Thu: ':''}${esc(r.type=='tf'?'Chuyển tiền':r.cat+' › '+r.sub)} · ${fmt(r.amt)}</div><div class="mu">Ngày ${r.day} hàng tháng · ${esc(an(r.acc))}${r.type=='tf'?' → '+esc(an(r.to)):''}${r.note?' · '+esc(r.note):''}</div></div><button class="s" onclick="delR('${r.id}')">Xóa</button></div>`).join(''):'<div class="mu">Chưa có. Vd: tiền nhà, gửi xe. Tự ghi vào đúng ngày hàng tháng.</div>'}</div>
${secCard()}
<div class="card"><h2>Dữ liệu</h2><div class="mu">Dữ liệu lưu trên trình duyệt máy này. Hãy sao lưu định kỳ.</div>
<textarea id="dt" rows="3" placeholder="Dữ liệu hiện ở đây / dán JSON để khôi phục"></textarea>
<button class="s" onclick="ex2('tsv')">Xuất bảng (dán vào Excel)</button> <button class="s" onclick="ex2('json')">Sao lưu JSON</button> <button class="s" onclick="rest()">Khôi phục</button></div>`}
function ex2(k){const t=$('#dt');t.value=k=='json'?JSON.stringify({...S,cp:undefined}):'Ngày\tLoại\tSố tiền\tTừ ví\tĐến ví\tNhóm\tMục\tGhi chú\n'+[...S.tx].sort((a,b)=>a.d.localeCompare(b.d)).map(x=>[x.d,{inc:'Thu',exp:'Chi',tf:'Chuyển',adj:'Điều chỉnh'}[x.type],x.amt,an(x.acc),x.to?an(x.to):'',x.cat||'',x.sub||'',(x.note||'').replace(/\s+/g,' ')].join('\t')).join('\n');t.select();try{navigator.clipboard.writeText(t.value).then(()=>alert('Đã copy'),()=>{})}catch(e){}}
function rest(){try{const o=JSON.parse($('#dt').value);if(!o.accounts||!o.tx)throw 0;if(confirm('Ghi đè dữ liệu hiện tại?')){const c0=S.cp;S=o;S.cp=c0;S.budget=S.budget||{};S.rec=S.rec||[];save();render()}}catch(e){alert('JSON không hợp lệ')}}
function addAcc(g){const n=prompt('Tên ví mới:');if(!n)return;const o=parseFloat(prompt('Số dư ban đầu (₫):','0'))||0;S.accounts.push({id:uid(),name:n.trim(),gid:g,open:o,hidden:false});save();render()}
function renA(id){const a=acc(id),n=prompt('Tên mới:',a.name);if(n){a.name=n.trim();save();render()}}
function rmA(id){const a=acc(id);if(S.tx.some(t=>t.acc==id||t.to==id)){a.hidden=!a.hidden}else if(confirm('Xóa ví '+a.name+'?'))S.accounts=S.accounts.filter(x=>x.id!=id);save();render()}
function addG(){const n=prompt('Tên nhóm ví:');if(n){S.groups.push({id:uid(),name:n.trim()});save();render()}}
function renG(id){const g=S.groups.find(x=>x.id==id),n=prompt('Tên mới:',g.name);if(n){g.name=n.trim();save();render()}}
function delG(id){if(S.accounts.some(a=>a.gid==id))return alert('Nhóm còn ví. Hãy xóa/ẩn hết ví trước.');S.groups=S.groups.filter(g=>g.id!=id);save();render()}

/* Category management */
function norm(s){return (s||'').trim().replace(/\s+/g,' ')}
function addCat(k){
  if(k=='inc'){
    const n=norm(prompt('Tên mục thu:'));
    if(!n)return;
    if(S.cats.inc.some(c=>c.toLowerCase()===n.toLowerCase()))return alert('Đã có hạng mục này');
    S.cats.inc.push(n);save();render();
  }else{
    const n=norm(prompt('Tên nhóm chi mới:'));
    if(!n)return;
    if(Object.keys(S.cats.exp).some(g=>g.toLowerCase()===n.toLowerCase()))return alert('Đã có nhóm này');
    S.cats.exp[n]=['Khác'];save();render();
  }
}
function renCat(k,i){
  if(k=='inc'){
    const old=S.cats.inc[i],n=norm(prompt('Tên mới:',old));
    if(!n||n===old)return;
    if(S.cats.inc.some((c,j)=>j!==i&&c.toLowerCase()===n.toLowerCase()))return alert('Trùng tên');
    S.cats.inc[i]=n;
    S.tx.forEach(t=>{if(t.type=='inc'&&t.cat===old){t.cat=n;t.sub=n}});
    save();render();
  }
}
function delCat(k,i){
  if(k=='inc'){
    const c=S.cats.inc[i];
    if(S.tx.some(t=>t.type=='inc'&&t.cat===c))return alert('Còn giao dịch dùng hạng mục này. Không thể xóa.');
    if(confirm('Xóa "'+c+'"?')){S.cats.inc.splice(i,1);save();render()}
  }
}
function renExpG(old){
  const n=norm(prompt('Tên nhóm mới:',old));
  if(!n||n===old)return;
  if(Object.keys(S.cats.exp).some(g=>g!==old&&g.toLowerCase()===n.toLowerCase()))return alert('Trùng tên');
  S.cats.exp[n]=S.cats.exp[old];delete S.cats.exp[old];
  S.tx.forEach(t=>{if(t.cat===old)t.cat=n});
  if(S.budget[old]){S.budget[n]=S.budget[old];delete S.budget[old]}
  save();render();
}
function delExpG(g){
  if(S.tx.some(t=>t.cat===g))return alert('Còn giao dịch thuộc nhóm này. Không thể xóa.');
  if(confirm('Xóa nhóm "'+g+'" và tất cả mục con?')){delete S.cats.exp[g];delete S.budget[g];save();render()}
}
function addSub(g){
  const n=norm(prompt('Tên mục con mới trong "'+g+'":'));
  if(!n)return;
  if((S.cats.exp[g]||[]).some(s=>s.toLowerCase()===n.toLowerCase()))return alert('Đã có mục con này');
  (S.cats.exp[g]=S.cats.exp[g]||[]).push(n);save();render();
}
function renSub(g,si){
  const old=S.cats.exp[g][si],n=norm(prompt('Tên mới:',old));
  if(!n||n===old)return;
  if(S.cats.exp[g].some((s,j)=>j!==si&&s.toLowerCase()===n.toLowerCase()))return alert('Trùng tên');
  S.cats.exp[g][si]=n;
  S.tx.forEach(t=>{if(t.cat===g&&t.sub===old)t.sub=n});
  save();render();
}
function delSub(g,si){
  const s=S.cats.exp[g][si];
  if(S.tx.some(t=>t.cat===g&&t.sub===s))return alert('Còn giao dịch dùng mục con này. Không thể xóa.');
  if(confirm('Xóa "'+s+'"?')){S.cats.exp[g].splice(si,1);if(!S.cats.exp[g].length)S.cats.exp[g]=['Khác'];save();render()}
}

function adj(id){const a=acc(id),v=prompt('Số dư/giá trị thực của "'+a.name+'" (₫):',Math.round(bal(a)));if(v===null)return;const n=parseFloat(String(v).replace(/[.,\s]/g,''));if(isNaN(n))return;const d=n-bal(a);if(d){S.tx.push({id:uid(),d:today(),type:'adj',amt:d,acc:id});save();render()}}
function del(id){if(confirm('Xóa giao dịch này?')){S.tx=S.tx.filter(t=>t.id!=id);save();render()}}
const closeM=()=>{$('#md').classList.remove('show');editId=null;recMode=false};

/* ===== CHI TIẾT VÍ + TÌM KIẾM ===== */
let accViewId=null,accQ='';
function viewAcc(id){
  accViewId=id;accQ='';
  const a=acc(id);if(!a)return;
  $('#mb').innerHTML=`<div class="mu" style="margin-bottom:6px">Chi tiết ví</div>
  <h3 style="margin:0 0 4px">${esc(a.name)}</h3>
  <div class="big" style="margin-bottom:12px">${fmt(bal(a))} ₫</div>
  <input id="accSearch" placeholder="Tìm theo ghi chú, hạng mục, từ khóa..." value="" autocomplete="off">
  <div class="mu" id="accCount" style="margin:6px 0"></div>
  <div id="accList"></div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="s" style="flex:1" onclick="goHistFromAcc()">Xem lịch sử</button>
    <button class="s" style="flex:1" onclick="closeM()">Đóng</button>
  </div>`;
  $('#md').classList.add('show');
  const inp=$('#accSearch');
  inp.oninput=()=>{accQ=inp.value;renderAccTxList()};
  renderAccTxList();
  setTimeout(()=>inp.focus(),100);
}
function goHistFromAcc(){
  closeM();
  tab='hist';
  render();
}
function editFromAcc(id){
  closeM();
  openTx(id);
}
function delFromAcc(id){
  if(!confirm('Xóa giao dịch này?'))return;
  S.tx=S.tx.filter(t=>t.id!=id);
  save();
  // Cập nhật lại số dư + danh sách trong modal
  const a=acc(accViewId);
  if(a){
    const big=$('#mb')&&$('#mb').querySelector('.big');
    if(big)big.textContent=fmt(bal(a))+' ₫';
  }
  renderAccTxList();
  // Đồng bộ tab Ví nếu đang mở nền
  if(tab==='home')render();
}
function renderAccTxList(){
  const a=acc(accViewId);if(!a)return;
  const q=(accQ||'').toLowerCase().trim();
  let list=S.tx.filter(t=>t.acc===a.id||t.to===a.id);
  if(q)list=list.filter(t=>{
    const hay=[t.note,t.cat,t.sub,an(t.acc),an(t.to),t.type,{inc:'thu',exp:'chi',tf:'chuyển',adj:'điều chỉnh'}[t.type]].join(' ').toLowerCase();
    return hay.includes(q);
  });
  list.sort((x,y)=>y.d.localeCompare(x.d)||(x.id||'').localeCompare(y.id||''));
  const cnt=$('#accCount');
  if(cnt)cnt.textContent=list.length+' giao dịch';
  const box=$('#accList');
  if(!box)return;
  if(!list.length){
    box.innerHTML='<div class="mu">Không có giao dịch phù hợp.</div>';
    return;
  }
  let html='',lastD='';
  list.slice(0,200).forEach(t=>{
    if(t.d!==lastD){lastD=t.d;html+=`<div class="dayh">${t.d}</div>`}
    const c={inc:'in',exp:'ex',tf:'tf',adj:'mu'}[t.type];
    const sg={inc:'+',exp:'−',tf:'⇄',adj:t.amt<0?'−':'+'}[t.type];
    const title=t.type=='adj'?'Điều chỉnh số dư':esc(t.cat||'Chuyển tiền')+(t.sub&&t.sub!=t.cat?' › '+esc(t.sub):'');
    const w=t.type=='tf'?`${esc(an(t.acc))} → ${esc(an(t.to))}`:esc(an(t.acc));
    const actions=t.type!='adj'
      ?`<button class="s" onclick="editFromAcc('${t.id}')">Sửa</button> <button class="s" onclick="delFromAcc('${t.id}')">Xóa</button>`
      :`<button class="s" onclick="delFromAcc('${t.id}')">Xóa</button>`;
    html+=`<div class="row"><div><div>${title}</div><div class="mu">${w}${t.note?' · '+esc(t.note):''}</div></div><div class="r ${c}"><b>${sg}${fmt(Math.abs(t.amt))}</b><br>${actions}</div></div>`;
  });
  box.innerHTML=html;
}

/* ===== THÊM/SỬA GIAO DỊCH + TÌM KIẾM VÍ/HẠNG MỤC ===== */
let editId=null,recMode=false;
let selAcc=null,selTo=null,selCat=null,selSub=null;
let qFa='',qTa='',qCat='';

function openTx(id,rec){
  editId=id||null;recMode=!!rec;
  const ed=id?S.tx.find(x=>x.id==id):null;
  if(ed)tType=ed.type;
  selAcc=ed?ed.acc:null;selTo=ed?ed.to:null;
  selCat=ed?ed.cat:null;selSub=ed?ed.sub:null;
  qFa='';qTa='';qCat='';
  $('#mb').innerHTML=`<div class="mu" style="margin-bottom:6px">${ed?'Sửa giao dịch':rec?'Giao dịch định kỳ (hàng tháng)':'Thêm giao dịch'}</div>
  <div class="seg" id="sg">${[['exp','Chi'],['inc','Thu'],['tf','Chuyển']].map(([k,l])=>`<button data-k="${k}" onclick="tType='${k}';buildPickers()">${l}</button>`).join('')}</div>
  <input id="am" type="number" inputmode="decimal" placeholder="Số tiền (₫)" style="font-size:24px;margin-top:10px">
  <div id="am2" class="mu"></div>
  <div id="accPick"></div>
  <div id="catPick"></div>
  ${rec?'<input id="dd" type="number" min="1" max="31" inputmode="numeric" placeholder="Ngày trong tháng (1-31)">':`<input id="dd" type="date" value="${today()}">`}
  <input id="nt" placeholder="Ghi chú">
  <button class="p" onclick="saveTx()">Lưu</button>`;
  $('#md').classList.add('show');
  $('#am').oninput=e=>$('#am2').textContent=e.target.value?fmt(e.target.value)+' ₫':'';
  buildPickers();
  if(ed){
    $('#am').value=ed.amt;
    $('#dd').value=ed.d;
    $('#nt').value=ed.note||'';
    $('#am').dispatchEvent(new Event('input'));
  }
}

function selectedChip(name, clearFn){
  if(!name) return '<span class="mu">Chưa chọn</span>';
  return `<span class="chip" style="background:var(--pr);color:#fff;border-color:var(--pr)">${esc(name)} <b onclick="${clearFn}" style="cursor:pointer;margin-left:4px">×</b></span>`;
}

function buildPickers(){
  document.querySelectorAll('#sg button').forEach(b=>b.classList.toggle('on',b.dataset.k==tType));

  // --- Ví nguồn ---
  const accName = selAcc ? an(selAcc) : '';
  let html = `<div class="mu">Từ ví ${selectedChip(accName,"selAcc=null;buildPickers()")}</div>
  <input id="sq_fa" placeholder="Gõ để tìm ví..." value="${esc(qFa)}" autocomplete="off">
  <div class="slist" id="list_fa"></div>`;

  if(tType==='tf'){
    const toName = selTo ? an(selTo) : '';
    html += `<div class="mu" style="margin-top:8px">Đến ví ${selectedChip(toName,"selTo=null;buildPickers()")}</div>
    <input id="sq_ta" placeholder="Gõ để tìm ví đích..." value="${esc(qTa)}" autocomplete="off">
    <div class="slist" id="list_ta"></div>`;
  }
  $('#accPick').innerHTML = html;

  // bind search inputs (không vẽ lại input → không mất focus)
  const faInp = $('#sq_fa');
  if(faInp){
    faInp.oninput = ()=>{ qFa = faInp.value; renderAccList('fa', qFa, selAcc, 'pickAcc'); };
    renderAccList('fa', qFa, selAcc, 'pickAcc');
  }
  const taInp = $('#sq_ta');
  if(taInp){
    taInp.oninput = ()=>{ qTa = taInp.value; renderAccList('ta', qTa, selTo, 'pickTo'); };
    renderAccList('ta', qTa, selTo, 'pickTo');
  }

  // --- Hạng mục ---
  if(tType==='tf'){
    $('#catPick').innerHTML = '';
    return;
  }

  const catLabel = tType==='inc' ? 'Hạng mục thu' : 'Hạng mục chi';
  const catDisp = selCat ? (selSub && selSub!==selCat ? selCat+' › '+selSub : selCat) : '';
  $('#catPick').innerHTML = `<div class="mu">${catLabel} ${selectedChip(catDisp,"selCat=null;selSub=null;buildPickers()")}</div>
  <input id="sq_cat" placeholder="Gõ để tìm hạng mục..." value="${esc(qCat)}" autocomplete="off">
  <div class="slist" id="list_cat"></div>`;

  const catInp = $('#sq_cat');
  if(catInp){
    catInp.oninput = ()=>{ qCat = catInp.value; renderCatList(qCat); };
    renderCatList(qCat);
  }
}

function renderAccList(target, q, selected, onPick){
  const box = $('#list_'+target);
  if(!box) return;
  const qq = (q||'').toLowerCase().trim();
  const list = S.accounts.filter(a=>!a.hidden).filter(a=>{
    if(!qq) return true;
    const g = S.groups.find(x=>x.id==a.gid);
    return a.name.toLowerCase().includes(qq) || (g && g.name.toLowerCase().includes(qq));
  });
  if(!list.length){
    box.innerHTML = '<div class="mu" style="padding:10px">Không tìm thấy</div>';
    return;
  }
  box.innerHTML = list.map(a=>{
    const g = S.groups.find(x=>x.id==a.gid);
    return `<div class="${selected==a.id?'on':''}" onclick="${onPick}('${a.id}')">${esc(a.name)} <span class="muted">${esc(g?g.name:'')}</span></div>`;
  }).join('');
}

function renderCatList(q){
  const box = $('#list_cat');
  if(!box) return;
  const qq = (q||'').toLowerCase().trim();
  let html = '';
  if(tType==='inc'){
    S.cats.inc.filter(c=>!qq || c.toLowerCase().includes(qq)).forEach(c=>{
      html += `<div class="${selCat==c?'on':''}" onclick="pickCat('${esc(c)}','${esc(c)}')">${esc(c)}</div>`;
    });
  }else{
    Object.keys(S.cats.exp).forEach(g=>{
      (S.cats.exp[g]||[]).forEach(s=>{
        if(qq && !g.toLowerCase().includes(qq) && !s.toLowerCase().includes(qq) && !(g+' '+s).toLowerCase().includes(qq)) return;
        html += `<div class="${selCat==g&&selSub==s?'on':''}" onclick="pickCat('${esc(g)}','${esc(s)}')"><b>${esc(g)}</b> › ${esc(s)}</div>`;
      });
    });
  }
  box.innerHTML = html || '<div class="mu" style="padding:10px">Không tìm thấy</div>';
}

function pickAcc(id){ selAcc=id; qFa=''; buildPickers(); }
function pickTo(id){ selTo=id; qTa=''; buildPickers(); }
function pickCat(c,s){ selCat=c; selSub=s; qCat=''; buildPickers(); }

function saveTx(){
  const amt=parseFloat($('#am').value);
  if(!(amt>0))return alert('Nhập số tiền');
  if(!selAcc)return alert('Chọn ví');
  if(tType=='tf'&&!selTo)return alert('Chọn ví đích');
  if(tType=='tf'&&selTo==selAcc)return alert('Chọn 2 ví khác nhau');
  if(tType!='tf'&&!selCat)return alert('Chọn hạng mục');
  const t={id:uid(),d:$('#dd').value||today(),type:tType,amt,acc:selAcc,note:$('#nt').value};
  if(tType=='tf')t.to=selTo;else{t.cat=selCat;t.sub=selSub}
  if(recMode){
    const day=parseInt($('#dd').value);
    if(!(day>=1&&day<=31))return alert('Nhập ngày 1-31');
    const n=today(),y=+n.slice(0,4),m=+n.slice(5,7);
    const nx=day>=+n.slice(8)?n.slice(0,7):(m==12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`);
    S.rec.push({id:uid(),type:t.type,amt,acc:t.acc,to:t.to,cat:t.cat,sub:t.sub,note:t.note,day,next:nx});
    runRec();save();closeM();render();return;
  }
  if(editId){const i=S.tx.findIndex(x=>x.id==editId);t.id=editId;S.tx[i]=t}else S.tx.push(t);
  const ow=t.type=='exp'?warns().find(x=>x.k==t.cat):null;
  save();closeM();render();
  if(ow)alert(`⚠ ${ow.k}: đã chi ${fmt(ow.s)} / ${fmt(ow.b)} (${Math.round(ow.s/ow.b*100)}%)`+(ow.s>=ow.b?' — VƯỢT ngân sách!':''));
}

/* ===== Bảo mật (PIN + sinh trắc) & đồng bộ Google ===== */
const enc=new TextEncoder(),dec=new TextDecoder(),rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const b64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
async function kdf(pw,salt){const k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aes(key,data){const iv=rnd(12);return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data))}}
const unaes=(key,o)=>crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.iv)},key,ub(o.ct));
const impMK=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',true,['encrypt','decrypt']);
let MK=null,pending=null,tm=null,fb=null,hid=0;const LK=$('#lk'),rr=()=>{if(MK)render()};
async function persist(){if(!MK||!S)return;W('qlct.d',await aes(MK,enc.encode(JSON.stringify(S))));clearTimeout(tm);tm=setTimeout(push,4000)}
async function setPin(pin,master){const salt=rnd(16),w=await aes(await kdf(pin,salt),await crypto.subtle.exportKey('raw',master));W('qlct.v',{salt:b64(salt),...w})}
const lockUI=h=>{LK.innerHTML='<div class="lkb">'+h+'</div>';LK.style.display='flex'};
function initApp(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').then(reg=>{
      // Tự nhận bản mới khi có cập nhật trên GitHub
      reg.update().catch(()=>{});
      setInterval(()=>reg.update().catch(()=>{}),60*60*1000);
      navigator.serviceWorker.addEventListener('controllerchange',()=>{
        // SW mới đã active → tải lại để dùng bản mới (không cần gỡ app)
        if(sessionStorage.getItem('qlct.upd'))return;
        sessionStorage.setItem('qlct.upd','1');
        location.reload();
      });
    }).catch(()=>{});
  }
  L('qlct.v')?unlockUI():setupUI();
}
function setupUI(){lockUI(`<h3>Tạo mã PIN</h3><div class="mu">Dùng để mở app và mã hóa dữ liệu trên máy (tối thiểu 6 ký tự).</div><input id="p1" type="password" inputmode="numeric" placeholder="PIN"><input id="p2" type="password" inputmode="numeric" placeholder="Nhập lại PIN"><button class="p" onclick="doSetup()">Tạo</button><button class="s" style="width:100%;margin-top:10px" onclick="restoreUI()">Khôi phục từ Google</button>`)}
async function doSetup(){const a=$('#p1').value;if(a.length<6||a!=$('#p2').value)return alert('PIN tối thiểu 6 ký tự và 2 lần phải khớp');MK=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']);await setPin(a,MK);S=pending||seed();await start()}
async function start(){S.budget=S.budget||{};S.rec=S.rec||[];runRec();await persist();LK.style.display='none';render()}
function unlockUI(){
  const b=L('qlct.bio');
  // Không tự gọi bio — tránh lỗi "Không có khoá truy cập"
  lockUI(`<h3>💰 Quản lý chi tiêu</h3><input id="pp" type="password" inputmode="numeric" placeholder="PIN"><button class="p" onclick="doUnlock()">Mở khóa</button>${b?'<button class="s" style="width:100%;margin-top:10px" onclick="bioUnlock()">🔐 Vân tay / khuôn mặt</button>':''}`);
  $('#pp').onkeydown=e=>{if(e.key=='Enter')doUnlock()};
}
async function loadData(){const d=L('qlct.d');S=d?JSON.parse(dec.decode(await unaes(MK,d))):seed()}
async function doUnlock(){try{const v=L('qlct.v');MK=await impMK(await unaes(await kdf($('#pp').value,ub(v.salt)),v));await loadData();await start()}catch(e){MK=null;$('#pp').value='';alert('Sai PIN')}}
const BS=enc.encode('qlct-prf-salt-v1');
async function bioKey(cid){const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:cid}],userVerification:'required',extensions:{prf:{eval:{first:BS}}}}});const r=a.getClientExtensionResults().prf;if(!r||!r.results||!r.results.first)return null;return crypto.subtle.importKey('raw',r.results.first,'AES-GCM',false,['encrypt','decrypt'])}
async function bioEnable(){try{const c=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Chi tiêu'},user:{id:rnd(16),name:'me',displayName:'Tôi'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},extensions:{prf:{}}}});const cid=new Uint8Array(c.rawId),k=await bioKey(cid);if(!k)return alert('Máy/trình duyệt này chưa hỗ trợ mở khóa sinh trắc cho app. Hãy dùng PIN.');W('qlct.bio',{cid:b64(cid),...await aes(k,await crypto.subtle.exportKey('raw',MK))});alert('Đã bật');rr()}catch(e){alert('Không bật được: '+e.message)}}
async function bioUnlock(){
  try{
    const b=L('qlct.bio');
    if(!b)return;
    const k=await bioKey(ub(b.cid));
    if(!k)throw new Error('no-key');
    MK=await impMK(await unaes(k,b));
    await loadData();
    await start();
  }catch(e){
    MK=null;
    // Xóa khóa hỏng để lần sau không còn nút lỗi
    try{localStorage.removeItem('qlct.bio')}catch(_){}
    unlockUI();
    alert('Vân tay/khuôn mặt không còn hiệu lực trên máy này. Hãy dùng PIN, rồi bật lại trong Cài đặt nếu cần.');
  }
}
async function chPin(){const p=prompt('PIN mới (tối thiểu 6 ký tự):');if(p&&p.length>=6){await setPin(p,MK);alert('Đã đổi PIN')}}
async function fbInit(){if(fb)return fb;const C=window.FIREBASE_CONFIG;if(!C||!C.apiKey||C.apiKey.startsWith('DIEN'))throw new Error('Chưa điền cấu hình Firebase (file firebase-config.js)');const B='https://www.gstatic.com/firebasejs/10.12.2/',[a,au,fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]),app=a.initializeApp(C);return fb={au,fs,auth:au.getAuth(app),db:fs.getFirestore(app)}}
async function signIn(){try{const f=await fbInit(),r=await f.au.signInWithPopup(f.auth,new f.au.GoogleAuthProvider());localStorage.setItem('qlct.u',r.user.email);rr()}catch(e){alert(e.message)}}
async function signOut(){try{const f=await fbInit();await f.au.signOut(f.auth)}catch(e){}localStorage.removeItem('qlct.u');rr()}
async function uidOf(){const f=await fbInit();await f.auth.authStateReady();if(!f.auth.currentUser)throw new Error('Chưa đăng nhập Google');return[f,f.auth.currentUser.uid]}
async function push(manual){if(!S||!S.cp||!localStorage.getItem('qlct.u')||!navigator.onLine){if(manual===true)alert('Cần: đã đăng nhập Google, đã đặt mật khẩu sao lưu và có mạng');return}
try{const[f,u]=await uidOf(),salt=rnd(16),e=await aes(await kdf(S.cp,salt),enc.encode(JSON.stringify({...S,cp:undefined})));await f.fs.setDoc(f.fs.doc(f.db,'vaults',u),{salt:b64(salt),...e,t:Date.now()});W('qlct.t',Date.now());rr()}catch(e){console.warn(e);if(manual===true)alert(e.message)}}
async function pull(){const[f,u]=await uidOf(),s=await f.fs.getDoc(f.fs.doc(f.db,'vaults',u));if(!s.exists())throw new Error('Chưa có bản sao lưu trên Google');const d=s.data(),pw=prompt('Mật khẩu sao lưu:');if(!pw)return null;let o;try{o=JSON.parse(dec.decode(await unaes(await kdf(pw,ub(d.salt)),d)))}catch(e){throw new Error('Sai mật khẩu sao lưu')}o.cp=pw;return o}
async function restoreUI(){try{await signIn();const o=await pull();if(o){pending=o;alert('Đã tải dữ liệu. Giờ hãy tạo PIN cho máy này rồi bấm Tạo.')}}catch(e){alert(e.message)}}
async function cloudRestore(){try{const o=await pull();if(o&&confirm('Ghi đè dữ liệu trên máy bằng bản từ Google?')){S=o;save();render()}}catch(e){alert(e.message)}}
async function setCP(){const p=prompt('Mật khẩu sao lưu (khác PIN, dài, ghi nhớ kỹ — quên là mất bản sao trên Google):');if(!p)return;if(p.length<8)return alert('Tối thiểu 8 ký tự');S.cp=p;save();await push(true);render()}
function secCard(){const u=localStorage.getItem('qlct.u'),t=L('qlct.t');return`<div class="card"><h2>Bảo mật &amp; Google</h2>
<div class="row"><span>Vân tay / khuôn mặt</span>${L('qlct.bio')?'<b class="in">Đang bật</b>':'<button class="s" onclick="bioEnable()">Bật</button>'}</div>
<div class="row"><span>PIN</span><button class="s" onclick="chPin()">Đổi</button></div>
<div class="row"><span>Khóa ngay</span><button class="s" onclick="location.reload()">Khóa</button></div>
<div class="row"><span>Tài khoản Google</span>${u?`<span class="mu">${esc(u)} <button class="s" onclick="signOut()">Thoát</button></span>`:'<button class="s" onclick="signIn()">Đăng nhập</button>'}</div>
<div class="row"><span>Mật khẩu sao lưu</span><button class="s" onclick="setCP()">${S.cp?'Đổi':'Đặt'}</button></div>
<div class="row"><span>Sao lưu gần nhất</span><span class="mu">${t?new Date(t).toLocaleString('vi-VN'):'chưa có'}</span></div>
<button class="s" onclick="push(true)">Sao lưu ngay</button> <button class="s" onclick="cloudRestore()">Tải từ Google</button></div>`}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(MK&&hid&&Date.now()-hid>60000)location.reload()});
initApp();
</script></body></html>
